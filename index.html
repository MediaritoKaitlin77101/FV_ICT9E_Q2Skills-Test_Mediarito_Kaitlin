    h1 {
        text-align: center;
        color: black;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        font-weight: bold;
        margin:0;
    }
    body{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background-image: url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/9804865a-f6de-47d0-b463-c569491b9621/OBMC+MONTESSORI+FV+1+-+AY+2026+FA.jpg');

    p {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
        text-align: center;
        padding: 15px;               
        width: 100%;                  
        margin-left: auto;           
        margin-right: auto;

    #portal{
      border-radius: 18px;
    }
    #button{
      border-radius: 18px;
    }
    #search{
      width: 50%;
    }
    .contact-box{
        max-width: 1000px;
        margin: 40px auto 20px;
        padding: 16px;
        background-color: rgb(148, 211, 190);
        border-radius: 14px;
        box-shadow: 0 4px 12px;}

    .form-header{
        background-color:rgb(21, 182, 184);
        border-radius: 14px;
        padding: 14px 12px;
        margin-bottom: 24px;}

    .form-header p{
        color: black;

        padding: 4px 0 0;

        font-size: 20px;
        font-weight: bold;

    .form-label{
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 6px;}

    .form-control, .form-control{
        font-size: 16px;
        padding: 10px 12px;
        border-radius: 8px;}

    #enrollment{
        font-size: 18px;
        padding: 10px 24px;
        border-radius: 8px;}
    #foot {
        background-color: rgb(25, 135, 84);     
        color:white;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;                 
        font-size: 18px;
        text-align: center;          
        padding: 16px 12px;               
        margin: 15px auto;            
        border-radius: 10px;         
        width: 85%;                  
        box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

</style>

        <button class="btn btn-success text-light" type="button" id="button">Search</button>

<div class="col contact-box">
    <div class="form-header">
    <h1>OBMC Student Enrollment Form</h1>
    <p>Fill out the form below to enroll for the upcoming school year.</p>
    </div>

    <form>
        <div class="mb-3" id="enroll-text">Student Information</div>
        
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="fname" class="form-label" id="fname">First Name:</label>
                <input type="fname" class="form-control" placeholder="John" required>
        </div>
    
        <div class="col-md-6">
            <label for="lname" class="form-label" id="lname">Last Name:</label>
            <input type="lname" class="form-control" placeholder="Doe" required>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label for="bday" class="form-label" id="bday">Birth Date:</label>
                <input type="date" class="form-control" placeholder="MM/DD/YYYY" required>
        </div>
      
        <div class="col-md-4">
            <label for="gender" class="form-label">Gender:</label>
            <select id="gender" name="gender" class="form-select" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="col-md-4">
            <label for="grade lvl" class="form-label">Grade Level:</label>
            <select id="grade" name="grade" class="form-select" required>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10</option>
            </select>
        </div>
      
        <div id="enroll-text">Contact Details:</div>

        <div class="mb-3">
            <label for="email" class="form-label" id="email">Email Address:</label>
            <input type="email" class="form-control" placeholder="john.doe@gmail.com" required>
        </div>

        <div class="mb-3">
            <label for="contact" class="form-label" id="contact">Contact Number:</label>
            <input type="contact" class="form-control" placeholder="0917-517-6201" required>
        </div>
      
        <div id="enroll-text">Other Information:</div>
        
        <div class="mb-0">
            <label for="mode" class="form-label" id="mode">Mode of Learning:</label>

            <div class="form-check">
                <input type="checkbox" id="mode1" name="mode1" value="Online">
                <label for="mode1">Online</label><br>
            </div>

            <div class="form-check">
                <input type="checkbox" id="mode2" name="mode2" value="Face-to-Face">
                <label for="mode2">Face-to-Face</label>   
            </div>
        </div>

        <div class="form-check mb-4 m-4" id="confirm">
          <input type="checkbox" id="checkbox" class="form-check-input">
          <label for="checkbox" class="form-check-label">I confirm that the information provided is true and complete.</label>
        </div>

        <div class="text-center">
            <a href="https://obmontessori.edu.ph/"><button class="btn btn-success text-light" type="button" id="enrollment">Submit Enrollment</button></a>
        </div>
            </form>
      </div>
    </div>
</div>
